name: Deploy Dokku

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOPPLER_PROJECT: fleet
  DOPPLER_CONFIG: prd_podmanfleet

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show 5 most recent commits
        run: git log --oneline -n 5

      - name: Install doppler-export
        uses: remotebrowser/shared-github-actions/setup-doppler@v1

      - name: Load deploy credentials from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler-export "$DOPPLER_PROJECT" "$DOPPLER_CONFIG" --format=json \
            >"$RUNNER_TEMP/doppler.json"

          # doppler-export only masks keys matching KEY/TOKEN/PASSWORD. add-mask matches
          # whole lines, so multi-line values must be masked line by line.
          jq -r '.TS_OAUTH_SECRET, .DOKKU_SSH_PRIVATE_KEY
                 | select(. != null) | split("\n")[] | select(. != "")
                 | "::add-mask::" + .' "$RUNNER_TEMP/doppler.json"

          # Heredoc form for every key: DOKKU_SSH_HOST_KEY is multi-line, and a bare
          # KEY=value line would break $GITHUB_ENV parsing.
          jq -r --arg src "$DOPPLER_PROJECT/$DOPPLER_CONFIG" '
            . as $env
            | ["TS_OAUTH_SECRET", "DOKKU_SSH_PRIVATE_KEY", "DOKKU_GIT_REMOTE_URL",
               "DOKKU_SSH_HOST_KEY", "APP_URL"][]
            | . as $key
            | ($env[$key] // ("::error::\($key) missing from Doppler \($src)\n"
                              | halt_error)) as $value
            | "\($key)<<__DOPPLER_EOF__\n\($value)\n__DOPPLER_EOF__"' \
            "$RUNNER_TEMP/doppler.json" >>"$GITHUB_ENV"

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: true

      - name: Show Tailnet IP address
        run: tailscale ip

      - name: Check the reachability of the app server
        run: curl -fsS "${APP_URL}/health"
        continue-on-error: true

      - name: Sync config from Doppler to Dokku
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DOKKU_SSH_HOST_KEY" >~/.ssh/known_hosts
          printf '%s\n' "$DOKKU_SSH_PRIVATE_KEY" >~/.ssh/dokku_ci
          chmod 600 ~/.ssh/dokku_ci

          rest=${DOKKU_GIT_REMOTE_URL#*@}
          host=${rest%%[:/]*}
          app=${DOKKU_GIT_REMOTE_URL##*/}

          # Everything in this Doppler config is app runtime config except the CI
          # credentials and the leftover Fly and GitHub tokens, which the app must
          # never see. NO_VHOST and the DOKKU_ prefix are generated by dokku itself.
          # --encoded takes base64 values, so a value with spaces or newlines survives
          # the trip through dokku's ssh command line intact.
          mapfile -t pairs < <(jq -r --arg rev "$GITHUB_SHA" '
            (to_entries[]
             | select(.key | test("^(DOKKU_|TS_|DOPPLER_)|^(APP_URL|FLY_API_TOKEN|GITHUB_TOKEN)$") | not)),
            {key: "GIT_REV", value: $rev}
            | "\(.key)=\(.value|@base64)"' "$RUNNER_TEMP/doppler.json")

          echo "Setting config vars: ${pairs[*]%%=*}"
          ssh -i ~/.ssh/dokku_ci "dokku@$host" \
            config:set --encoded --no-restart "$app" "${pairs[@]}"

      - name: Deploy via dokku
        uses: dokku/github-action@master
        with:
          trace: 1
          branch: main
          git_push_flags: --force
          git_remote_url: ${{ env.DOKKU_GIT_REMOTE_URL }}
          ssh_host_key: ${{ env.DOKKU_SSH_HOST_KEY }}
          ssh_private_key: ${{ env.DOKKU_SSH_PRIVATE_KEY }}

      - name: Verify deployment via health endpoint
        run: |-
          set -uo pipefail
          echo "Expected commit: $GITHUB_SHA"
          echo "App URL: $APP_URL"

          # The app may still be restarting right after the push, so retry for ~2 minutes.
          for attempt in $(seq 1 24); do
            response=$(curl -fsS "${APP_URL}/health") || response=""
            echo "Attempt $attempt: ${response:-<unreachable>}"

            # Health format: "OK <timestamp> GIT_REV: <commit>"
            remote=$(grep -o 'GIT_REV: [a-f0-9]*' <<<"$response" | cut -d' ' -f2)
            if [ "$remote" = "$GITHUB_SHA" ]; then
              echo "✅ Deployment and health endpoint verified successfully"
              exit 0
            fi
            sleep 5
          done

          echo "Error: health endpoint never reported GIT_REV $GITHUB_SHA"
          exit 1
