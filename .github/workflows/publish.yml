name: Publish Container Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-local-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Start Podman socket
        run: |
          sudo systemctl enable --now podman.socket
          sudo chmod 755 /run/podman
          sudo chmod 666 /run/podman/podman.sock

      - name: Verify Podman socket
        env:
          CONTAINER_HOST: unix:///run/podman/podman.sock
        run: podman --remote run --rm quay.io/podman/hello

      - name: Pull Chromium container image
        env:
          CONTAINER_HOST: unix:///run/podman/podman.sock
        run: podman --remote pull ghcr.io/remotebrowser/chrome-live

      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t podmanfleet -f Dockerfile .

      - name: Run container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name podmanfleet \
            --network host \
            -e CONTAINER_HOST=unix:///run/podman/podman.sock \
            -v /run/podman/podman.sock:/run/podman/podman.sock \
            podmanfleet

      - name: Wait for health checks
        shell: bash
        run: |
          set -euo pipefail
          for url in http://localhost:8400/health http://localhost:8400/extended-health; do
            echo "Polling $url for 'OK' (timeout 180s)..."
            timeout 180 bash -c 'until curl -fs "$1" | grep -q "$2"; do sleep 1; done' _ "$url" "OK"
          done

      - name: Container logs
        if: always()
        shell: bash
        run: docker logs --details podmanfleet || true

      - name: Remove container
        if: always()
        shell: bash
        run: docker rm -f podmanfleet || true

  build-and-publish:
    runs-on: ubuntu-24.04
    needs: test-local-container
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  test-published-container:
    runs-on: ubuntu-24.04
    needs: build-and-publish
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Start Podman socket
        run: |
          sudo systemctl enable --now podman.socket
          sudo chmod 755 /run/podman
          sudo chmod 666 /run/podman/podman.sock

      - name: Verify Podman socket
        env:
          CONTAINER_HOST: unix:///run/podman/podman.sock
        run: podman --remote run --rm quay.io/podman/hello

      - name: Prepare Chromium container image
        env:
          CONTAINER_HOST: unix:///run/podman/podman.sock
        run: podman --remote pull ghcr.io/remotebrowser/chrome-live

      - name: Pull published container image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest published-podmanfleet

      - name: Run container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name test-published-container \
            --network host \
            -e CONTAINER_HOST=unix:///run/podman/podman.sock \
            -v /run/podman/podman.sock:/run/podman/podman.sock \
            published-podmanfleet

      - name: Wait for health checks
        shell: bash
        run: |
          set -euo pipefail
          for url in http://localhost:8400/health http://localhost:8400/extended-health; do
            echo "Polling $url for 'OK' (timeout 180s)..."
            timeout 180 bash -c 'until curl -fs "$1" | grep -q "$2"; do sleep 1; done' _ "$url" "OK"
          done

      - name: Container logs
        if: always()
        shell: bash
        run: docker logs --details test-published-container || true

      - name: Remove container
        if: always()
        shell: bash
        run: docker rm -f test-published-container || true
