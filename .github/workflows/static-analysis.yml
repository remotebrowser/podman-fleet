name: Static Analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-format:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        shell: bash
        run: uv sync --all-extras --dev

      - name: Check backend formatting
        run: make check-backend-format

  backend-types:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        shell: bash
        run: uv sync --all-extras --dev

      - name: Check backend types with ty
        run: make typecheck

  yaml-format:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        shell: bash
        run: uv sync --all-extras --dev

      - name: Check YAML formatting
        run: make check-yaml-format
