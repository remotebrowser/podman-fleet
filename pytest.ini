[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
norecursedirs = .* venv node_modules
pythonpath = .
asyncio_default_fixture_loop_scope = function
markers =
    e2e: integration tests that require a running PodmanFleet server
addopts = -v --cov=podmanfleet --cov-report=term-missing
