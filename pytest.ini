[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
norecursedirs = .* venv node_modules
pythonpath = .
asyncio_default_fixture_loop_scope = function
markers =
    e2e: integration tests that require a running PodmanFleet server
addopts = -v --cov=podmanfleet --cov-report=term-missing
filterwarnings =
    # pytest-asyncio gives each test its own event loop (function-scoped above); an alru_cache
    # sees that as a loop change and safely auto-clears, which is only "unusual" in tests, not
    # in the app itself (one event loop for the process lifetime). See async_lru's own docstring.
    ignore:alru_cache detected event loop change.*:async_lru.AlruCacheLoopResetWarning
