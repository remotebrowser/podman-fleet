[project]
name = "podmanfleet"
version = "0.1.1"
description = "Run browsers in containers and control them remotely"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "nanoid>=2.0.0",
  "pydantic>=2.11.3",
  "pydantic-settings>=2.9.1",
  "pyyaml>=6.0.2",
  "sentry-sdk[fastapi]>=2.29.1",
  "rich>=14.0.0",
  "fastapi>=0.115.12",
  "uvicorn[standard]>=0.34.2",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "websockets>=15.0.1",
  "async-lru>=2.0",
  "geoip2>=5.2.0",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.23.5",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.7.0",
  "ruff>=0.11.6",
  "ty>=0.0.1a19",
  "yamlfix>=1.6.1",
]

[project.scripts]
podmanfleet = "podmanfleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podmanfleet"]

[tool.hatch.build.targets.wheel.force-include]
"podmanfleet/webui" = "podmanfleet/webui"

[tool.hatch.build]
only-packages = true

[tool.ruff]
src = ["podmanfleet", "tests"]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.venv",
  "**/venv",
  "**/htmlcov",
  "**/alembic/versions",
  "**/node_modules",
  "**/*env/*",
  "**/.git",
  "**/*.yaml",
  "**/*.yml",
]
line-length = 100
preview = true

[tool.ruff.lint]
select = ["I", "UP045", "UP006", "UP007"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["podmanfleet", "tests"]

[tool.ty.rules]
invalid-argument-type = "ignore"

[tool.yamlfix]
exclude = ["**/.venv/**"]
explicit_start = false
line_length = 120
whitelines = 1
